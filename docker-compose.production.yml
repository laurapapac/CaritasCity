services:
  postgres:
    image: postgres:16-alpine
    container_name: caritascity-postgres
    restart: unless-stopped
    env_file:
      - .env.production
    volumes:
      - caritascity_postgres_data:/var/lib/postgresql/data
    networks:
      - caritascity

  backend:
    image: caritascity-backend:test
    container_name: caritascity-backend
    restart: unless-stopped
    env_file:
      - .env.production
    depends_on:
      - postgres
    ports:
      - "127.0.0.1:3001:3001"
    networks:
      - caritascity

  frontend:
    image: caritascity-frontend:test
    container_name: caritascity-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:80"
    networks:
      - caritascity

volumes:
  caritascity_postgres_data:

networks:
  caritascity:
    driver: bridge
