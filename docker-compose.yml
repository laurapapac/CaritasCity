services:
  postgres:
    image: postgres:16-alpine
    container_name: caritascity-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: caritas
      POSTGRES_PASSWORD: caritas_dev_pw
      POSTGRES_DB: caritascity
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
